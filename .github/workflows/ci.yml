name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: protocol (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check
        run: python -m compileall -q kassist.py tools tests

      - name: Lint the installer
        run: shellcheck install.sh tests/ci.sh debian/kassist-setup debian/postinst

      - name: Protocol smoke test (headless)
        run: bash tests/ci.sh

  distro:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Protocol smoke test in ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} \
            sh -c "apt-get update -qq && apt-get install -y -qq python3 && bash tests/ci.sh"

  deb:
    name: deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .deb
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            debian:13 \
            sh -c "apt-get update -qq && apt-get install -y -qq debhelper dpkg-dev \
                   && cp -a /src /tmp/build && cd /tmp/build \
                   && dpkg-buildpackage -us -uc -b \
                   && cp ../kassist_*.deb /src/ \
                   && dpkg-deb -c /src/kassist_*.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: kassist-deb
          path: kassist_*.deb

  rpm:
    name: rpm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .rpm
        run: |
          mkdir -p "$RUNNER_TEMP/stage/Keychron-Assist-Linux-0.1.0" "$RUNNER_TEMP/out"
          tar -C . --exclude=.git --exclude='*/__pycache__' --exclude='*.pyc' -cf - . \
            | tar -C "$RUNNER_TEMP/stage/Keychron-Assist-Linux-0.1.0" -xf -
          tar -C "$RUNNER_TEMP/stage" -czf "$RUNNER_TEMP/out/v0.1.0.tar.gz" Keychron-Assist-Linux-0.1.0
          docker run --rm \
            -v "$RUNNER_TEMP/out:/rpmbuild" \
            -v "$PWD/packaging/kassist.spec:/spec/kassist.spec:ro" \
            fedora:44 \
            bash -c "dnf -y install rpm-build systemd-rpm-macros >/dev/null 2>&1 \
                     && mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS \
                     && cp /rpmbuild/v0.1.0.tar.gz /root/rpmbuild/SOURCES/ \
                     && cp /spec/kassist.spec /root/rpmbuild/SPECS/ \
                     && rpmbuild -bb /root/rpmbuild/SPECS/kassist.spec \
                     && cp /root/rpmbuild/RPMS/noarch/*.rpm /rpmbuild/"

      - uses: actions/upload-artifact@v4
        with:
          name: kassist-rpm
          path: ${{ runner.temp }}/out/*.rpm
